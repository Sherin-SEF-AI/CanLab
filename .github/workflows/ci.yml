name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,rest,mcp,mdf]"

      - name: Lint
        run: ruff check canlab tests

      - name: Byte-compile all sources
        run: python -m py_compile $(git ls-files 'canlab/*.py' 'canlab/**/*.py' 'tests/*.py')

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,rest,mcp]"

      # Catches bundling gaps such as a missing Qt submodule in canlab.spec
      # (e.g. QtMultimedia) that only surface in the packaged binary.
      - name: PyInstaller build
        run: pyinstaller --noconfirm canlab.spec

      - name: Smoke-check the built binary exists
        run: test -x dist/CanLab/CanLab
